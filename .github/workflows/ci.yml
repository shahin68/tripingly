name: CI

# Runs on pull requests only: a merge into develop builds the same code the PR already checked.
# The iOS job runs on macOS, whose minutes count 10x on private repos, so it runs only when the
# PR gets the `ios-ci` label (once, before review). Remove and re-add the label to run it again.
on:
  pull_request:
    branches: [develop, master]
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.agents/**'

concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'ios' || 'android' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build and tests
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug app
        run: ./gradlew :androidApp:assembleDebug

      - name: Unit tests (common + Android host)
        run: ./gradlew allTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: '**/build/reports/tests/'

  ios:
    name: iOS framework and tests
    if: github.event.action == 'labeled' && github.event.label.name == 'ios-ci'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Link the shared framework for the simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Unit tests on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: '**/build/reports/tests/'
