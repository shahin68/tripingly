name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The default branch (master) never runs CI, so the cache is saved from develop and read by PRs.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Assemble debug app
        run: ./gradlew :androidApp:assembleDebug

      - name: Unit tests (common + Android host)
        run: ./gradlew allTests

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: '**/build/reports/tests/'

  ios:
    name: iOS framework and tests
    # Runs alongside Android while the repo is public (free minutes). If it goes private again, macOS
    # minutes count 10x: add `needs: android` back so this job only runs once Android is green.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The default branch (master) never runs CI, so the cache is saved from develop and read by PRs.
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Link the shared framework for the simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Unit tests on the iOS simulator
        run: ./gradlew iosSimulatorArm64Test

      # Compiles the app's Swift code (sign-in, Google Maps) against the shared framework.
      - name: Build the iOS app for the simulator
        run: >
          xcodebuild build -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: '**/build/reports/tests/'
